<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Counter App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            min-width: 300px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .counter-display {
            font-size: 64px;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
            transition: all 0.3s ease;
        }

        .counter-display.pulse {
            transform: scale(1.1);
            color: #764ba2;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-increment {
            background: #667eea;
            color: white;
        }

        .btn-increment:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-decrement {
            background: #ff6b6b;
            color: white;
        }

        .btn-decrement:hover {
            background: #ee5a52;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.4);
        }

        .btn-reset {
            background: #51cf66;
            color: white;
        }

        .btn-reset:hover {
            background: #40c057;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(81, 207, 102, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .info {
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Counter App</h1>
        <div class="counter-display" id="counter">0</div>
        <div class="button-group">
            <button class="btn-decrement" onclick="decrementCounter()">Decrease</button>
            <button class="btn-reset" onclick="resetCounter()">Reset</button>
            <button class="btn-increment" onclick="incrementCounter()">Increase</button>
        </div>
        <div class="info">
            <p>Click buttons to change the counter value</p>
        </div>
    </div>

    <script>
        let count = 0;
        const counterDisplay = document.getElementById('counter');
