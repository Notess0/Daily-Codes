<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Color Mixer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .slider-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .color-display {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: background-color 0.1s ease;
        }
        
        .info {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            font-family: 'Courier New', monospace;
        }
        
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Color Mixer</h1>
        
        <div class="slider-group">
            <label for="red">Red: <span id="redValue">128</span></label>
            <input type="range" id="red" min="0" max="255" value="128">
        </div>
        
        <div class="slider-group">
            <label for="green">Green: <span id="greenValue">128</span></label>
            <input type="range" id="green" min="0" max="255" value="128">
        </div>
        
        <div class="slider-group">
            <label for="blue">Blue: <span id="blueValue">128</span></label>
            <input type="range" id="blue" min="0" max="255" value="128">
        </div>
        
        <div class="color-display" id="colorDisplay"></div>
        
        <div class="info">
            <p id="rgbText">rgb(128, 128, 128
