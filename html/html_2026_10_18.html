<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Color Mixer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .color-display {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            border-radius: 15px;
            background: #ff6b6b;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            transition: background-color 0.1s ease;
        }
        
        .slider-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        #redSlider {
            background: linear-gradient(90deg, rgb(0,0,0), rgb(255,0,0));
        }
        
        #greenSlider {
            background: linear-gradient(90deg, rgb(0,0,0), rgb(0,255,0));
        }
        
        #blueSlider {
            background: linear-gradient(90deg, rgb(0,0,0), rgb(0,0,255));
        }
        
        .color-code {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            color: #333;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .color-code:hover {
            background: #e0e0e0;
        }
    </style>
</head>
